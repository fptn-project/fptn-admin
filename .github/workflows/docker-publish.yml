name: Docker

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

env:
  REGISTRY_NAMESPACE: fptnvpn

jobs:
  docker:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fptn-admin-backend
            context: ./backend
          - image: fptn-admin-frontend
            context: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          username: ${{ env.REGISTRY_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'release' }}
          tags: |
            ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:${{ github.event.release.tag_name || github.sha }}
            ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:latest
          provenance: false
          sbom: false
